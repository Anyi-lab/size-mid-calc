name: build-windows

# 推送到 main 或手动点 Run workflow 都会触发
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm install

      - name: 校验 Tauri 配置
        shell: pwsh
        run: |
          npx tauri info *>&1 | Tee-Object -FilePath tauri-info.txt

      - name: 编译 Tauri 应用
        id: build_app
        shell: pwsh
        # 把编译输出同时写进文件，失败时随 artifact 一起下载
        run: |
          npx tauri build --verbose *>&1 | Tee-Object -FilePath build-log.txt
          exit $LASTEXITCODE

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-log.txt
            tauri-info.txt
          if-no-files-found: warn

      - name: 列出产物
        if: always()
        run: |
          Write-Host "=== release 目录 ==="
          if (Test-Path src-tauri\target\release) {
            Get-ChildItem -Path src-tauri\target\release -Filter *.exe -ErrorAction SilentlyContinue | Select-Object Name, Length
          } else { Write-Host "release 目录不存在" }
          Write-Host "=== bundle 目录 ==="
          if (Test-Path src-tauri\target\release\bundle) {
            Get-ChildItem -Path src-tauri\target\release\bundle -Recurse -Include *.msi,*.exe -ErrorAction SilentlyContinue | Select-Object FullName, Length
          } else { Write-Host "bundle 目录不存在" }

      - name: 上传 exe（绿色单文件）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-mid-calc-exe
          path: src-tauri/target/release/*.exe
          if-no-files-found: warn

      - name: 上传安装包（msi + nsis）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-mid-calc-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
