name: build-windows

# 推送到 main 或手动点 Run workflow 都会触发
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      # 缓存 cargo 依赖，第二次之后的构建会快很多
      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm install

      - name: 编译 Tauri 应用
        run: npm run tauri build

      - name: 列出产物
        run: |
          Write-Host "=== 单文件 exe ==="
          Get-ChildItem -Path src-tauri\target\release -Filter *.exe | Select-Object Name, Length
          Write-Host "=== 安装包 ==="
          Get-ChildItem -Path src-tauri\target\release\bundle -Recurse -Include *.msi,*.exe | Select-Object FullName, Length

      - name: 上传 exe（绿色单文件）
        uses: actions/upload-artifact@v4
        with:
          name: size-mid-calc-exe
          # 用通配符，避免中文文件名或 productName 改动导致路径失配
          path: src-tauri/target/release/*.exe
          if-no-files-found: warn

      - name: 上传安装包（msi + nsis）
        uses: actions/upload-artifact@v4
        with:
          name: size-mid-calc-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
